<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Personal OS</title>
    <script>
      (() => {
        try {
          const storedMode =
            window.localStorage.getItem("yeonsik-note-theme-mode") ??
            window.localStorage.getItem("local-sync-memo-theme-mode") ??
            "system";
          const mode = ["system", "light", "dark"].includes(storedMode)
            ? storedMode
            : "system";
          const prefersDark = window.matchMedia?.(
            "(prefers-color-scheme: dark)",
          )?.matches ?? false;
          const useDark = mode === "dark" || (mode !== "light" && prefersDark);

          document.documentElement.classList.toggle("dark", useDark);
          document.documentElement.dataset.theme = useDark ? "dark" : "light";
          document.documentElement.dataset.themeMode = mode;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.themeMode = "system";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
